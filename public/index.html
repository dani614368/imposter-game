<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/socket.io/socket.io.js"></script>
    <script src="index.css"></script>
    
    <title>imposter Game</title>


</head>
<body>
<form class="join-Game">
    <input type="text" id="name" maxlength="8" placeholder="name..." required>
    <input type="text" id="room" placeholder="Game-room" required>
    <button type="submit">Join</button>
</form>

<ul class="chat-display"></ul>


<p class="user-list"></p>
<p class="room-list"></p>
<p class="activity"></p>
<p class="secret-word"></p>

<form class="form-msg">
    <input id="msgInput" type="text" placeholder="message...">
    <button type="submit">send</button>
</form>


    <script src="/app.js"></script>
</body>
</html>
